<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>R package stats by Peter Solymos</title>
    <meta
      name="description"
      content="Monthly download counts and reverse dependencies for R packages maintained by Peter Solymos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
    />
    <style>
      :root {
        --accent: #2563eb;
        --surface: #ffffff;
        --bg: #f7f8fa;
        --text-muted: #6b7280;
      }

      html,
      body {
        background-color: var(--bg);
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      nav.navbar {
        height: 5rem !important;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.06),
          0 1px 2px 0 rgba(0, 0, 0, 0.04) !important;
      }

      .navbar-item.brand {
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .hero.is-brand {
        background: linear-gradient(135deg, #eef2ff 0%, #f7f8fa 60%);
      }

      .hero.is-brand .title {
        color: #1f2937;
      }

      .hero.is-brand .subtitle {
        color: var(--text-muted);
      }

      .chart-card {
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06),
          0 1px 3px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(15, 23, 42, 0.05);
      }

      .footer {
        background-color: var(--surface);
        border-top: 1px solid rgba(15, 23, 42, 0.06);
      }

      /* typeahead styling */
      .typeahead,
      .tt-query,
      .tt-hint {
        width: 320px;
        height: 40px;
        padding: 8px 14px;
        font-size: 15px;
        line-height: 24px;
        border: 1px solid #e2e5ea;
        border-radius: 8px;
        outline: none;
      }

      .typeahead {
        background-color: var(--surface);
      }

      .typeahead:focus {
        border: 1px solid var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .tt-query {
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.04);
      }

      .tt-hint {
        color: #9aa0aa;
      }

      .tt-menu {
        width: 320px;
        margin: 8px 0;
        padding: 6px 0;
        background-color: var(--surface);
        color: #1f2937;
        border: 1px solid #e2e5ea;
        border-radius: 8px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      }

      .tt-suggestion {
        padding: 6px 16px;
        font-size: 15px;
        line-height: 22px;
      }

      .tt-suggestion:hover,
      .tt-suggestion.tt-cursor {
        cursor: pointer;
        color: #fff;
        background-color: var(--accent);
      }

      .tt-suggestion p {
        margin: 0;
      }

      #scrollable-dropdown-menu .tt-menu {
        max-height: 250px;
        overflow-y: auto;
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item brand is-size-5">
            📦 Packages by @psolymos
          </a>
          <span class="navbar-burger burger" data-target="navbarMenu">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
        <div id="navbarMenu" class="navbar-menu">
          <div class="navbar-end">
            <div class=" navbar-item">
              <div class="field is-grouped" id="spp-search">
                <div class="control has-icons-left">
                  <div id="scrollable-dropdown-menu">
                    <input
                      class="input is-rounded typeahead"
                      id="spp-select"
                      type="text"
                      placeholder="Search R packages…"
                    />
                    <span class="icon is-small is-left">
                      <i class="fas fa-search"></i>
                    </span>
                  </div>
                </div>
              </div>
            </div>
            <a
              class="navbar-item is-size-5 has-text-weight-semibold"
              href="https://github.com/psolymos"
              target="_blank"
            >
              <span class="icon"><i class="fab fa-github"></i></span>
              <span>GitHub</span>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <section class="hero is-brand">
      <div class="hero-body">
        <div class="container">
          <h1 class="title is-3">R Package Stats</h1>
          <p class="subtitle is-6">
            Monthly downloads and reverse dependencies for packages maintained
            by @psolymos
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="columns is-desktop">
          <div class="column">
            <div class="box chart-card">
              <div id="lineDl" style="width:100%; height:320px;"></div>
            </div>
          </div>
          <div class="column">
            <div class="box chart-card">
              <div id="lineRd" style="width:100%; height:320px;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="content has-text-centered">
        <p id="footer">
          Data from
          <a href="https://cranlogs.r-pkg.org/" target="_blank">cranlogs</a>
          &middot; Charts by
          <a href="https://echarts.apache.org/" target="_blank"
            >Apache ECharts</a
          >
        </p>
      </div>
    </footer>
    <script type="text/javascript" src="./assets/jquery.min.js"></script>
    <script
      type="text/javascript"
      src="./assets/typeahead.bundle.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"
    ></script>
    <script>
      $(document).ready(function() {
        //const baseurl = ".";
        const baseurl = "https://peter.solymos.org/packages";

        // burger navbar
        var burger = document.querySelector(".burger");
        var menu = document.querySelector("#" + burger.dataset.target);
        burger.addEventListener("click", function() {
          burger.classList.toggle("is-active");
          menu.classList.toggle("is-active");
        });

        function areaTimeAxisOption(title, seriesName) {
          return {
            tooltip: {
              trigger: "axis",
              position: function(pt) {
                return [pt[0], "10%"];
              }
            },
            title: {
              left: "center",
              text: title,
              subtext: ""
            },
            xAxis: {
              type: "time",
              boundaryGap: false
            },
            yAxis: {
              type: "value",
              boundaryGap: [0, "30%"]
            },
            dataZoom: [
              {
                type: "inside",
                start: 0,
                end: 100
              },
              {
                start: 0,
                end: 100
              }
            ],
            series: [
              {
                name: seriesName,
                type: "line",
                smooth: true,
                symbol: "none",
                areaStyle: {},
                itemStyle: { color: "#2563eb" },
                data: []
              }
            ]
          };
        }

        var dlChart = echarts.init(document.getElementById("lineDl"));
        dlChart.setOption(areaTimeAxisOption("Download stats", "Monthly downloads"));
        var rdChart = echarts.init(document.getElementById("lineRd"));
        rdChart.setOption(areaTimeAxisOption("Reverse dependencies", "Reverse dependencies"));

        // link dataZoom (slider) interaction between the two charts
        dlChart.group = "packageCharts";
        rdChart.group = "packageCharts";
        echarts.connect("packageCharts");

        window.addEventListener("resize", function() {
          dlChart.resize();
          rdChart.resize();
        });

        function toSeriesData(dates, counts) {
          return dates.map(function(d, i) {
            return [d, counts[i]];
          });
        }

        function updateCharts(blob) {
          var subtext = blob.organization + "/" + blob.name;
          dlChart.setOption({
            title: { subtext: subtext },
            series: [{ data: toSeriesData(blob.downloads.date, blob.downloads.count) }]
          });
          rdChart.setOption({
            title: { subtext: subtext },
            series: [{ data: toSeriesData(blob.revdeps.date, blob.revdeps.count) }]
          });
        }

        $.getJSON(
          baseurl + "/stats_latest.json",
          function(data) {
            var defaultBlob = data.filter(function(val) {
              return val.name == "pbapply";
            });
            updateCharts(defaultBlob.length ? defaultBlob[0] : data[2]);
            var species = data.map(val => val.name);

            // typeahead
            var substringMatcher = function(strs) {
              return function findMatches(q, cb) {
                var matches, substringRegex;
                matches = [];
                substrRegex = new RegExp(q, "i");
                $.each(strs, function(i, str) {
                  if (substrRegex.test(str)) {
                    matches.push(str);
                  }
                });
                cb(matches);
              };
            };

            $("#spp-search .typeahead").typeahead(
              {
                hint: true,
                highlight: true,
                minLength: 0
              },
              {
                name: "species",
                source: substringMatcher(species),
                limit: 1000
              }
            );

            $.fn.pressEnter = function(fn) {
              return this.each(function() {
                $(this).bind("enterPress", fn);
                $(this).keyup(function(e) {
                  if (e.keyCode == 13) {
                    $(this).trigger("enterPress");
                  }
                });
              });
            };

            function checkSpecies(arr, val) {
              return arr.some(function(arrVal) {
                return val === arrVal;
              });
            }

            // links to species page
            $("#spp-select").pressEnter(function() {
              var spp = $("#spp-select").val();
              var OK = checkSpecies(species, spp);
              if (spp != "" && OK == true) {
                console.log(spp);
                console.log(data);
                var blob = data.filter(function(val) {
                  return val.name == spp;
                });
                console.log(blob);
                updateCharts(blob[0]);
              }
            });

        });
      });
    </script>
  </body>
</html>
